<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burner Key — Claude BYOK Proxy & Kontrol Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <!-- Top Navbar -->
  <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-[1550px] flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-rose-500 to-amber-500 text-base font-bold text-white shadow-lg shadow-rose-500/20">
          🔥
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white">Burner Key</h1>
          <p class="text-xs text-slate-400">
            BYOK Uygulamaları için Bütçe, TTL ve Kill-Switch Korumalı Claude Proxy
          </p>
        </div>
      </div>

      <!-- View Switcher (Utku) -->
      <div class="flex items-center rounded-xl border border-slate-800 bg-slate-900 p-1">
        <button data-view-mode="split" type="button" class="rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition">
          Tümü
        </button>
        <button data-view-mode="dashboard" type="button" class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 transition">
          Panel
        </button>
        <button data-view-mode="simulator" type="button" class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 transition">
          Simülatör
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="mx-auto max-w-[1550px] p-4">
    <div id="main-grid" class="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
      <section id="dashboard-col" class="xl:col-span-7">
        <div id="dashboard-root"></div>
      </section>
      <section id="simulator-col" class="xl:col-span-5 xl:sticky xl:top-20">
        <div id="simulator-root"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initDashboard } from "./dashboard.js";
    import { initSimulator } from "./simulator.js";

    initDashboard();
    initSimulator();
  </script>
</body>
</html>
