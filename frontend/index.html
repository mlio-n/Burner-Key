<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burner Key — Kontrol Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-view="split">
  <!-- Top bar (Utku) -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Burner Key</h1>
    </div>
    <div class="topbar-cell meta">BYOK Proxy · Bütçe / TTL / Kill Switch</div>
    <div class="spacer"></div>
    <div class="topbar-cell meta clock" id="clock">--:--:--</div>
    <div class="topbar-cell views">
      <div class="seg" role="group" aria-label="Görünüm">
        <button data-view-mode="split" type="button" aria-pressed="true">Tümü</button>
        <button data-view-mode="dashboard" type="button" aria-pressed="false">Panel</button>
        <button data-view-mode="simulator" type="button" aria-pressed="false">Simülatör</button>
      </div>
    </div>
  </header>

  <main id="workspace">
    <section id="dashboard-col">
      <div id="dashboard-root"></div>
    </section>
    <section id="simulator-col">
      <div id="simulator-root"></div>
    </section>
  </main>

  <script type="module">
    import { initDashboard } from "./dashboard.js";
    import { initSimulator } from "./simulator.js";

    initDashboard();
    initSimulator();
  </script>
</body>
</html>
